profile:
  schema_version: 4
  id: default
  name: "Default FMCW LiDAR"
  description: "Safe default full-period acquisition profile"
  author: "FMCW LiDAR Team"
  created_utc: "2026-07-10T00:00:00Z"
  modified_utc: "2026-07-10T00:00:00Z"
digitizer:
  system_id: 1
  board_id: 1
  board_profile: ats9371
  channel: a
  sample_rate_hz: 1000000000
  sample_point: 4096
  records_per_buffer: 64
  a_scan_count: 64
  b_scan_count: 25
  input_range_volts: 0.4
  coupling: dc
  impedance_ohms: 50
  trigger_source: external
  trigger_slope: rising
  trigger_level_percent: 17.3
  trigger_delay_samples: 400
  pre_trigger_samples: 0
  post_trigger_samples: 4096
  timeout_ms: 1000
  dma_buffer_count: 8
  fifo_only_streaming: true
  acquisition_mode: continuous
  finite_frame_count: 1
laser:
  wavelength_nm: 1550
  sweep_bandwidth_hz: 2000000000
  sweep_rate_hz_per_s: 200000000000000
  chirp_period_us: 20
  laser_power_mw: 10
  optical_path_factor: 1
  distance_scale_correction: 1
  velocity_scale_correction: 1
edfa:
  mode: none
  required_before_start: false
  port: ""
  baud_rate: 9600
  parity: none
  stop_bits: 1
  timeout_ms: 500
  control_mode: apc
  output_setpoint:
    value: 10
    unit: dbm
  output_min_dbm: 0
  output_max_dbm: 23
  warmup_delay_ms: 3000
  stop_acquisition_on_disconnect: true
scan:
  x_start_deg: -9
  x_end_deg: 9
  y_start_deg: -9
  y_end_deg: 9

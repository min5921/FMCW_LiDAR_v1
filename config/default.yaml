  x_pixel_count: 64
  y_line_count: 25
  trigger_shift_samples: 0
  scanner_sample_rate_hz: 100000
chirp_segmentation:
  mode: up_chirp_only
  trigger_to_period_offset: 128
  chirp_period_samples: 3840
  up_segment:
    start_sample: 192
    end_sample_exclusive: 1920
  down_segment:
    start_sample: 2112
    end_sample_exclusive: 3840
  guard_samples: 64
  segment_fft_length: 2048
  window: hann
  polarity: invert_down
processing:
  fft_backend: fftw
  dc_removal: true
  peak_threshold_db: -45
  peak_search_start_bin: 2
  peak_search_end_bin: 900
  queue_capacity: 32
  overflow_policy: stop_acquisition
udp:

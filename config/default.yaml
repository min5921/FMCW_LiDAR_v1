  velocity_offset_mps: 0
  velocity_scale: 1
  x_angle_offset_deg: 0
  y_angle_offset_deg: 0
mcu:
  enabled: false
  port: ""
  baud_rate: 115200
  parity: none
  stop_bits: 1
  timeout_ms: 500
  retry_count: 2
